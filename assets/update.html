{% extends "admin/challenges/update.html" %}

{% block value %}
<div class="form-group">
	<label for="value">Current Value<br>
		<small class="form-text text-muted">
			This is how many points the challenge is worth right now.
		</small>
	</label>
	<input type="number" class="form-control chal-value" name="value" value="{{ challenge.value }}" disabled>
</div>

<div class="form-group">
	<label for="value">Initial Value<br>
		<small class="form-text text-muted">
			This is how many points the challenge was worth initially.
		</small>
	</label>
	<input type="number" class="form-control chal-initial" name="initial" value="{{ challenge.initial }}" required>
</div>

<div class="form-group">
	<label for="value">Decay<br>
		<small class="form-text text-muted">
			<span>The points will be calculated the following way, using the supplied values:</span>
			<span><code>Initial * (DecayBase ^ (DecayFactor * SolveCount) </code></span>
		</small>
	</label>
	<input type="number" step="any" class="form-control" name="decay_base" value="{{ challenge.decay_base }}" required>
	<input type="number" step="any" class="form-control" name="decay_factor" value="{{ challenge.decay_factor }}"
		required>
</div>

<div class="form-group">
	<label for="value">Minimum Value<br>
		<small class="form-text text-muted">
			This is the lowest that the challenge can be worth
		</small>
	</label>
	<input type="number" class="form-control chal-minimum" name="minimum" value="{{ challenge.minimum }}" required>
</div>
<div class="form-group">
	<label for="short_name">Short Name<br>
		<small class="form-text text-muted">
			Internal short name used for deployment.
		</small>
	</label>
	<input type="text" class="form-control" name="short_name" value="{{ challenge.short_name }}" disabled>
</div>
{% endblock %}
