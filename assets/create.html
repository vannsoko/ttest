{% extends "admin/challenges/create.html" %}

{% block header %}
<div class="alert alert-secondary" role="alert">
	This is a challenge that works with our instancer.
</div>
{% endblock %}


{% block value %}
<div class="form-group">
	<label for="value">Initial Value<br>
		<small class="form-text text-muted">
			This is how many points the challenge is worth initially.
		</small>
	</label>
	<input type="number" class="form-control" name="initial" placeholder="Enter value" required>
</div>

<div class="form-group">
	<label for="value">Decay<br>
		<small class="form-text text-muted">
			<span>The points will be calculated the following way, using the supplied values:</span>
			<span><code>Initial * (DecayBase ^ (DecayFactor * SolveCount) </code></span>
		</small>
	</label>
	<input type="number" step="any" class="form-control" name="decay_base" placeholder="Enter Decay Base" required>
	<input type="number" step="any" class="form-control" name="decay_factor" placeholder="Enter Decay Factor" required>
</div>

<div class="form-group">
	<label for="value">Minimum Value<br>
		<small class="form-text text-muted">
			This is the lowest that the challenge can be worth
		</small>
	</label>
	<input type="number" class="form-control" name="minimum" placeholder="Enter minimum value" required>
</div>

<div class="form-group">
	<label for="short_name">Short Name<br>
		<small class="form-text text-muted">
			Internal short name used for deployment.
		</small>
	</label>
	<input type="text" class="form-control" name="short_name" placeholder="Enter short name" required>
</div>
{% endblock %}

{% block type %}
<input type="hidden" value="instancer" name="type" id="chaltype">
{% endblock %}
