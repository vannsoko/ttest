{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4">Overview</h1>
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form action="/instancer-plugin/pregenerate" method="post">
                <label for="min_team_id">Min Team ID (inclusive):</label>
                <input type="number" id="min_team_id" name="min_team_id" required>
                <br><br>

                <label for="max_team_id">Max Team ID (inclusive):</label>
                <input type="number" id="max_team_id" name="max_team_id" required>
                <br><br>

                <input type="hidden" name="nonce" value="{{ nonce }}">

                <button type="submit">Pregenerate</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
